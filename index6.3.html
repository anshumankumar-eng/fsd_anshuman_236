<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>___USER FORM FILLING___ </title>
    <style>
          * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #16630a, #f1953e, #fdbb2d);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        header {
            background: linear-gradient(90deg, #2c3e50, #4ca1af);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-style: italic;
            font-weight: 300;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        
        .info-panel {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }
        
        .test-panel {
            flex: 2;
            min-width: 400px;
            padding: 20px;
            border-left: 1px solid #eee;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #4ca1af;
        }
        
        p {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .disclaimer {
            background-color: #ffe6e6;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin: 20px 0;
        }
        
        .features {
            margin: 20px 0;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .feature i {
            color: #4ca1af;
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: white;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            touch-action: none;
            width: 100%;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        button {
            background-color: #4ca1af;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s;
            margin: 5px;
            flex-grow: 1;
        }
        
        button:hover {
            background-color: #2c3e50;
        }
        
        #analyze-btn {
            background-color: #2c3e50;
        }
        
        #analyze-btn:hover {
            background-color: #1a252f;
        }
        
        #clear-btn {
            background-color: #e74c3c;
        }
        
        #clear-btn:hover {
            background-color: #c0392b;
        }
        
        .result-container {
            margin-top: 20px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        
        .risk-meter {
            height: 30px;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
            border-radius: 15px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
        }
        
        .risk-needle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #2c3e50;
            transform: translateX(-50%);
        }
        
        .risk-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .metric {
            text-align: center;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 5px 0;
        }
        
        .metric-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .interpretation {
            background-color: #e8f4fc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .test-panel {
                border-left: none;
                border-top: 1px solid #eee;
            }
        }
    
    </style>
           
        
    </style>
</head>
<body>
    <h1>
        USER FORM----
    </h1>
    <hr>
    <P>*Provide the given details-</P>
    <form>

        <div>
        
    <label for="Father's name"></label> Father's Name :<label>

             </div>
          


    </form>
   


    
</body>
</html>
