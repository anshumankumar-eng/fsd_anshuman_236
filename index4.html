<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table, th, td {
            border: 2px solid black;
             border-collapse: collapse;
             padding: 25px;
        }
    </style>
    </style>
</head>
<body>
    <h1 style="color: blue;">TABLE</h1>
    <p style="color: blueviolet;">Table with horizontal heading</p>
    <table>
    <tr>
   <th>First name</th>
   <td>Sumit</td>
   <td>Amit</td>
    </tr>
    
    <tr>
    <th>Last name</th>
   <td>sharma</td>
   <td>verma</td>
    </tr>
    
    <tr>
    <th>age</th>
   <td>19</td>
   <td>20</td>
    </tr>
    <tr>
    <th>Gender</th>
   <td>Male</td>
   <td>Male</td>
    </tr>
    </table>

    
</body>
</html>
